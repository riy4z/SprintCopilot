definitions:
  jira.DependencyEdge:
    properties:
      from:
        type: string
      label:
        type: string
      to:
        type: string
      type:
        type: string
    type: object
  jira.DependencyGraphData:
    properties:
      edges:
        items:
          $ref: '#/definitions/jira.DependencyEdge'
        type: array
      nodes:
        items:
          $ref: '#/definitions/jira.DependencyNode'
        type: array
    type: object
  jira.DependencyNode:
    properties:
      assignee:
        type: string
      id:
        type: string
      isBlocked:
        type: boolean
      isBlocker:
        type: boolean
      isInCycle:
        type: boolean
      isSprintSafe:
        type: boolean
      priority:
        type: string
      summary:
        type: string
    type: object
  jira.ProjectCategory:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  jira.ProjectResponse:
    properties:
      Avatar:
        type: string
      Category:
        type: string
      avatarUrls:
        additionalProperties:
          type: string
        type: object
      id:
        type: string
      key:
        type: string
      name:
        type: string
      projectCategory:
        $ref: '#/definitions/jira.ProjectCategory'
      sprintGraph:
        items:
          $ref: '#/definitions/jira.SprintData'
        type: array
      teamSize:
        type: integer
      velocity:
        type: integer
    type: object
  jira.ProjectTeamResponse:
    properties:
      projectKey:
        type: string
      teamMembers:
        items:
          $ref: '#/definitions/jira.TeamMember'
        type: array
      velocity:
        type: integer
    type: object
  jira.SprintData:
    properties:
      sprintName:
        type: string
      velocity:
        type: integer
    type: object
  jira.TeamMember:
    properties:
      avatarUrl:
        type: string
      email:
        type: string
      name:
        type: string
      sprintHistory:
        items:
          additionalProperties: {}
          type: object
        type: array
      userId:
        type: string
      velocity:
        type: integer
    type: object
info:
  contact: {}
paths:
  /health:
    get:
      description: Check if server, Redis, Jira, and OpenAI are accessible
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - Health
  /jira/{projectKey}/backlogs:
    get:
      consumes:
      - application/json
      description: Fetch all backlog issues (unassigned to sprints) for a specific
        Jira project
      parameters:
      - description: Project Key
        example: '"SCO"'
        in: path
        name: projectKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Backlog tickets with metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid project key
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get Jira Backlog Issues
      tags:
      - Jira
  /jira/{projectKey}/dependency-graph:
    get:
      consumes:
      - application/json
      description: Fetch dependency graph with nodes and edges for backlog issues,
        including cycle detection
      parameters:
      - description: Project Key
        example: '"SCO"'
        in: path
        name: projectKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Dependency graph with nodes and edges
          schema:
            $ref: '#/definitions/jira.DependencyGraphData'
        "400":
          description: Invalid project key
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get Dependency Graph for Project Backlog
      tags:
      - Jira
  /jira/{projectKey}/sprints:
    get:
      consumes:
      - application/json
      description: Fetch all sprints for a specific Jira project using JQL search
      parameters:
      - description: Project Key
        example: '"SCO"'
        in: path
        name: projectKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of sprint data
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Invalid project key
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get Sprints by Project
      tags:
      - Jira
  /jira/callback:
    get:
      consumes:
      - application/json
      description: Handles OAuth callback from Jira Cloud and exchanges authorization
        code for an access token
      parameters:
      - description: Authorization code returned by Atlassian
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state value
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Access token response
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Token exchange failed
          schema:
            additionalProperties: true
            type: object
      summary: Jira OAuth callback
      tags:
      - OAuth
  /jira/oauth:
    get:
      description: Redirects user to Jira Cloud OAuth2 login page
      produces:
      - application/json
      responses:
        "307":
          description: Redirect
          headers:
            Location:
              description: OAuth login URL
              type: string
          schema:
            type: string
      summary: Connect Jira OAuth
      tags:
      - OAuth
  /jira/projects:
    get:
      consumes:
      - application/json
      description: Fetch all Jira projects from the connected Jira cloud instance
      produces:
      - application/json
      responses:
        "200":
          description: List of Jira projects
          schema:
            items:
              $ref: '#/definitions/jira.ProjectResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get Jira Projects
      tags:
      - Jira
  /jira/projects/{projectKey}/team:
    get:
      consumes:
      - application/json
      description: Fetch all assignable team members for a specific Jira project
      parameters:
      - description: Project Key
        example: '"SCO"'
        in: path
        name: projectKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Project team members with velocity data
          schema:
            $ref: '#/definitions/jira.ProjectTeamResponse'
        "400":
          description: Invalid project key
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get Team Members by Project
      tags:
      - Jira
swagger: "2.0"
